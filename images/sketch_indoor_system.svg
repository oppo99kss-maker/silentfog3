<text x="40" y="300" font-size="16" font-family="Tajawal, sans-serif" fill="black" transform="rotate(-90 40,300)">10 متر</text>

<!-- Main Line -->
<line x1="100" y1="280" x2="900" y2="280" 
      stroke="red" stroke-width="2"/>
<text x="450" y="265" font-size="14" font-family="Tajawal, sans-serif" fill="red">خط رئيسي</text>

