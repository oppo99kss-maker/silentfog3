<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">

<!-- Background -->
<rect width="100%" height="100%" fill="white"/>

<!-- Title -->
<text x="350" y="30" font-size="20" font-family="Tajawal, sans-serif" fill="black">مخطط نظام ضباب داخلي - 20م × 10م</text>

<!-- Building Outline -->
<rect x="100" y="80" width="800" height="400" 
      fill="none" stroke="blue" stroke-width="3"/>

